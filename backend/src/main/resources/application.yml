server:
  port: 8080

spring:
  application:
    name: shopstream-backend
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopstream}
    username: ${SPRING_DATASOURCE_USERNAME:shopstream}
    password: ${SPRING_DATASOURCE_PASSWORD:shopstream123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    socket-timeout: 3000ms
    connection-timeout: 2000ms

shopstream:
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_mock_shopstream_key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_shopstream_secret}
    mock-mode: ${STRIPE_MOCK_MODE:true}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    model: ${AI_MODEL:gemini-1.5-flash}
    fallback-enabled: true
  cart:
    session-ttl-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

logging:
  level:
    com.shopstream: INFO
    org.springframework.web: INFO
